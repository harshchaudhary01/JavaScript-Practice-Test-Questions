<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <img src="https://st3.depositphotos.com/15648834/17930/v/450/depositphotos_179308454-stock-illustration-unknown-person-silhouette-glasses-profile.jpg" alt="User Profile Picture" class="profile-image">
        <div class="user-name">Harsh Kumar Chaudhary</div>
        <div class="bio">Web Developer | Tech Enthusiast | Web Designer | UI/UX Designer</div>
        <div class="info-sections">
            <div class="info-section">
                <h3>150</h3>
                <p>Posts</p>
            </div>
            <div class="info-section">
                <h3>3000</h3>
                <p>Followers</p>
            </div>
            <div class="info-section">
                <h3>180</h3>
                <p>Following</p>
            </div>
        </div>
        <button class="follow-button">Follow</button>
    </div>
</body>
</html>
